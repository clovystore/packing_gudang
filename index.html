<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Gudang</title>
<style>
  :root{
    --bg:#0b141a; --panel:#111b21; --panel2:#202c33; --line:#2a3942;
    --text:#e9edef; --sub:#8696a0; --accent:#00a884; --accent-dark:#005c4b;
    --bubble-in:#202c33; --danger:#e04b4b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}

  #topbar{display:flex; align-items:center; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0;}
  #sidebar-header{padding:12px 16px; font-size:16px; font-weight:600; flex-shrink:0; display:flex; align-items:center; gap:8px;}
  #conn-dot{width:8px; height:8px; border-radius:50%; background:var(--danger); display:inline-block;}
  #conn-dot.ok{background:var(--accent);}
  #cat-list{flex:1; display:flex; overflow-x:auto; overflow-y:hidden; border-left:1px solid var(--line);}
  .cat-item{padding:12px 16px; cursor:pointer; display:flex; justify-content:flex-start; align-items:center; gap:8px; flex-shrink:0; white-space:nowrap; border-right:1px solid var(--line);}
  .cat-item:hover{background:var(--panel2);}
  .cat-item.active{background:var(--panel2);}
  .cat-name{font-size:15px;}
  .cat-count{font-size:12px; color:var(--bg); background:var(--accent); border-radius:12px; padding:2px 8px; min-width:20px; text-align:center;}
  #add-cat-btn{flex-shrink:0; width:40px; height:40px; margin:6px 10px; border-radius:50%; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:20px; cursor:pointer;}

  #range-bar{display:flex; gap:6px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; overflow-x:auto;}
  .range-btn{flex-shrink:0; padding:6px 14px; border-radius:16px; border:1px solid var(--line); background:var(--panel2); color:var(--sub); font-size:13px; cursor:pointer;}
  .range-btn.active{background:var(--accent); color:#052014; border-color:var(--accent); font-weight:600;}

  #main{flex:1; display:flex; flex-direction:column; background:#0a1014;}
  #main-header{padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); font-size:16px; font-weight:600;}
  #feed{flex:1; overflow-y:auto; padding:20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; align-content:start;}
  .empty-state{grid-column:1/-1; margin:auto; color:var(--sub); text-align:center; font-size:14px; max-width:320px;}

  .entry{background:var(--bubble-in); border-radius:10px; padding:8px 10px 6px;}
  .entry .who{font-size:13px; font-weight:600; color:#7fd4c4; margin-bottom:4px;}
  .entry .photos{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .entry img{width:90px; height:90px; object-fit:cover; border-radius:8px; cursor:zoom-in; flex-shrink:0;}
  .entry .note{font-size:14px; line-height:1.4; white-space:pre-wrap;}
  .entry .meta{font-size:11px; color:var(--sub); text-align:right; margin-top:4px;}
  .entry .delbtn{font-size:11px; color:var(--danger); cursor:pointer; margin-left:8px;}

  #composer{background:var(--panel); border-top:1px solid var(--line); padding:10px 16px; display:flex; flex-direction:column; gap:8px;}
  #name-row{display:flex; gap:8px; align-items:center;}
  #name-row input{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px; width:180px;}
  #name-row span{font-size:12px; color:var(--sub);}
  #photo-preview{display:flex; gap:8px; flex-wrap:wrap;}
  #photo-preview .ph{position:relative; width:64px; height:64px;}
  #photo-preview img{width:64px; height:64px; object-fit:cover; border-radius:6px;}
  #photo-preview .rm{position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff; border-radius:50%; width:18px; height:18px; font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #input-row{display:flex; gap:8px; align-items:flex-end;}
  #note-input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:10px 16px; color:var(--text); font-size:14px; resize:none; max-height:100px; min-height:20px;}
  .icon-btn{background:var(--panel2); border:1px solid var(--line); border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:18px;}
  #send-btn{background:var(--accent); color:#052014;}
  #file-input, #file-input-camera{display:none;}
  #status{font-size:11px; color:var(--sub); text-align:center; min-height:14px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (max-width:700px){
    #feed{padding:12px; grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="sidebar-header">
      <span>Log Gudang</span>
      <span id="conn-dot" title="Status koneksi"></span>
    </div>
    <div id="cat-list"></div>
    <button id="add-cat-btn" title="Tambah kategori">+</button>
  </div>
  <div id="main">
    <div id="main-header" id="main-title">Pilih kategori</div>
    <div id="range-bar">
      <button class="range-btn active" data-range="day">Hari ini</button>
      <button class="range-btn" data-range="week">Minggu ini</button>
      <button class="range-btn" data-range="month">Bulan ini</button>
      <button class="range-btn" data-range="all">Semua</button>
    </div>
    <div id="feed"><div class="empty-state">Menghubungkan ke database...</div></div>
    <div id="composer">
      <div id="name-row">
        <span>Nama:</span>
        <input id="name-input" placeholder="Nama kamu" maxlength="40"/>
      </div>
      <div id="photo-preview"></div>
      <div id="input-row">
        <div class="icon-btn" id="camera-btn" title="Ambil foto dari kamera">📷</div>
        <div class="icon-btn" id="gallery-btn" title="Pilih dari galeri">🖼️</div>
        <input type="file" id="file-input" accept="image/*" multiple>
        <input type="file" id="file-input-camera" accept="image/*" capture="environment">
        <textarea id="note-input" placeholder="Tulis catatan (qty, kondisi, dll)..." rows="1"></textarea>
        <div class="icon-btn" id="send-btn" title="Kirim">➤</div>
      </div>
      <div id="status"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// =====================================================================
// GANTI OBJEK DI BAWAH INI dengan firebaseConfig dari Firebase Console
// (Project settings > General > scroll ke "Your apps" > SDK setup)
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyCCXvCR25dQiTDTNMW8mJBWR5f3gSc14Fg",
  authDomain: "clovy-log-packing-gudang.firebaseapp.com",
  projectId: "clovy-log-packing-gudang",
  storageBucket: "clovy-log-packing-gudang.firebasestorage.app",
  messagingSenderId: "772473495759",
  appId: "1:772473495759:web:c2f7e8152cb32c04a7d7ba"
};
// =====================================================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DEFAULT_CATEGORIES = ["Packing","ATK","Stock","Retur & Refund","SPX"];
let categories = [];
let activeCategory = null;
let activeRange = 'day';
let pendingPhotos = [];
let entriesCache = {}; // category -> array of entries (sorted)

function isInRange(ts, range){
  if(range==='all') return true;
  const now = new Date();
  const d = new Date(ts);
  if(range==='day'){
    return d.toDateString() === now.toDateString();
  }
  if(range==='week'){
    const start = new Date(now);
    const day = (now.getDay()+6)%7; // Monday=0
    start.setDate(now.getDate()-day);
    start.setHours(0,0,0,0);
    return d >= start;
  }
  if(range==='month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  return true;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function status(msg){ document.getElementById('status').textContent = msg; }

function setConnected(ok){
  document.getElementById('conn-dot').className = ok ? 'ok' : '';
}

// ---------- Categories ----------
async function ensureCategoriesDoc(){
  const ref = doc(db, 'meta', 'categories');
  onSnapshot(ref, (snap)=>{
    setConnected(true);
    if(snap.exists() && snap.data().list && snap.data().list.length){
      categories = snap.data().list;
    } else {
      categories = DEFAULT_CATEGORIES.slice();
      setDoc(ref, { list: categories }).catch(()=>{});
    }
    renderSidebar();
    if(!activeCategory && categories.length) selectCategory(categories[0]);
  }, (err)=>{
    console.error(err);
    setConnected(false);
    status('Gagal terhubung ke database. Cek konfigurasi Firebase.');
  });
}

async function addCategory(name){
  if(categories.includes(name)) return;
  categories.push(name);
  await setDoc(doc(db,'meta','categories'), { list: categories });
}

// ---------- Entries ----------
function listenCategory(cat){
  const q = query(collection(db, 'entries', cat, 'items'), orderBy('timestamp','asc'));
  onSnapshot(q, (snap)=>{
    const arr = [];
    snap.forEach(d=> arr.push(d.data()));
    entriesCache[cat] = arr;
    if(activeCategory === cat) renderFeed();
    renderSidebar();
  }, (err)=>{
    console.error(err);
  });
}

const listenedCategories = new Set();
function ensureListening(cat){
  if(listenedCategories.has(cat)) return;
  listenedCategories.add(cat);
  listenCategory(cat);
}

// ---------- Rendering ----------
function renderSidebar(){
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  for(const cat of categories){
    ensureListening(cat);
    const count = (entriesCache[cat]||[]).length;
    const div = document.createElement('div');
    div.className = 'cat-item' + (cat===activeCategory ? ' active':'');
    div.innerHTML = `<span class="cat-name">${escapeHtml(cat)}</span><span class="cat-count">${count}</span>`;
    div.onclick = ()=> selectCategory(cat);
    list.appendChild(div);
  }
}

function selectCategory(cat){
  activeCategory = cat;
  document.getElementById('main-title').textContent = cat;
  ensureListening(cat);
  renderSidebar();
  renderFeed();
}

function renderFeed(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  if(!activeCategory){
    feed.innerHTML = '<div class="empty-state">Pilih kategori di kiri untuk mulai</div>';
    return;
  }
  const allEntries = entriesCache[activeCategory] || [];
  const entries = allEntries.filter(e => isInRange(e.timestamp, activeRange));
  if(entries.length===0){
    feed.innerHTML = `<div class="empty-state">${allEntries.length===0 ? 'Belum ada entri. Tambahkan foto/catatan pertama di bawah.' : 'Tidak ada entri pada rentang waktu ini.'}</div>`;
    return;
  }
  for(const e of entries){
    const div = document.createElement('div');
    div.className = 'entry';
    let photosHtml = '';
    if(e.photos && e.photos.length){
      photosHtml = `<div class="photos">${e.photos.map(p=>`<img src="${p}" onclick="window.open(this.src)"/>`).join('')}</div>`;
    }
    div.innerHTML = `
      <div class="who">${escapeHtml(e.name||'Tanpa nama')}</div>
      ${photosHtml}
      ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
      <div class="meta">${new Date(e.timestamp).toLocaleString('id-ID')} <span class="delbtn" data-id="${e.id}">Hapus</span></div>
    `;
    feed.appendChild(div);
  }
  feed.querySelectorAll('.delbtn').forEach(btn=>{
    btn.onclick = ()=> deleteEntry(btn.dataset.id);
  });
  feed.scrollTop = feed.scrollHeight;
}

async function deleteEntry(id){
  if(!confirm('Hapus entri ini?')) return;
  try{
    await deleteDoc(doc(db, 'entries', activeCategory, 'items', id));
  }catch(e){ console.error(e); status('Gagal menghapus.'); }
}

// ---------- Photo handling ----------
function resizeImage(file, maxDim=700, quality=0.55){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h && w>maxDim){ h = h*maxDim/w; w = maxDim; }
        else if(h>maxDim){ w = w*maxDim/h; h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPhotoPreview(){
  const box = document.getElementById('photo-preview');
  box.innerHTML = '';
  pendingPhotos.forEach((p, idx)=>{
    const div = document.createElement('div');
    div.className = 'ph';
    div.innerHTML = `<img src="${p}"/><div class="rm" data-idx="${idx}">×</div>`;
    box.appendChild(div);
  });
  box.querySelectorAll('.rm').forEach(rm=>{
    rm.onclick = ()=>{
      pendingPhotos.splice(parseInt(rm.dataset.idx),1);
      renderPhotoPreview();
    };
  });
}

// ---------- Events ----------
document.getElementById('camera-btn').onclick = ()=> document.getElementById('file-input-camera').click();
document.getElementById('gallery-btn').onclick = ()=> document.getElementById('file-input').click();

async function handlePickedFiles(fileList){
  const files = Array.from(fileList).slice(0, 3 - pendingPhotos.length);
  if(files.length===0){ status('Maksimal 3 foto per kiriman.'); return; }
  status('Memproses foto...');
  for(const f of files){
    try{
      const dataUrl = await resizeImage(f);
      pendingPhotos.push(dataUrl);
    }catch(err){ console.error(err); }
  }
  renderPhotoPreview();
  status('');
}

document.getElementById('file-input').onchange = async (e)=>{
  await handlePickedFiles(e.target.files);
  e.target.value = '';
};

document.getElementById('file-input-camera').onchange = async (e)=>{
  await handlePickedFiles(e.target.files);
  e.target.value = '';
};

document.getElementById('add-cat-btn').onclick = async ()=>{
  const name = (window.prompt('Nama kategori baru:') || '').trim();
  if(!name) return;
  await addCategory(name);
  selectCategory(name);
};

document.getElementById('note-input').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight,100)+'px';
});
document.getElementById('note-input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('send-btn').click();
  }
});

document.getElementById('send-btn').onclick = async ()=>{
  if(!activeCategory){ status('Pilih kategori dulu.'); return; }
  const name = document.getElementById('name-input').value.trim();
  const note = document.getElementById('note-input').value.trim();
  if(!name){ status('Isi nama kamu dulu.'); return; }
  if(!note && pendingPhotos.length===0){ status('Tulis catatan atau lampirkan foto.'); return; }

  localStorage.setItem('log-gudang-username', name);

  const id = uid();
  const entry = { id, name, note, photos: pendingPhotos.slice(), timestamp: Date.now() };
  status('Mengirim...');
  try{
    await setDoc(doc(db, 'entries', activeCategory, 'items', id), entry);
    document.getElementById('note-input').value = '';
    document.getElementById('note-input').style.height = 'auto';
    pendingPhotos = [];
    renderPhotoPreview();
    status('');
  }catch(err){
    console.error(err);
    status('Gagal mengirim. Foto mungkin terlalu besar, coba kurangi jumlah foto.');
  }
};

document.querySelectorAll('.range-btn').forEach(btn=>{
  btn.onclick = ()=>{
    activeRange = btn.dataset.range;
    document.querySelectorAll('.range-btn').forEach(b=> b.classList.toggle('active', b===btn));
    renderFeed();
  };
});

// ---------- Init ----------
const savedName = localStorage.getItem('log-gudang-username');
if(savedName) document.getElementById('name-input').value = savedName;
ensureCategoriesDoc();
</script>
</body>
</html>
