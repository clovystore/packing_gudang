<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log Gudang</title>
<style>
  :root{
    --bg:#0b141a; --panel:#111b21; --panel2:#202c33; --line:#2a3942;
    --text:#e9edef; --sub:#8696a0; --accent:#00a884; --accent-dark:#005c4b;
    --bubble-in:#202c33; --danger:#e04b4b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh;
  }
  #app{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;}

  #topbar{display:flex; align-items:center; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; position:sticky; top:0; z-index:20; height:49px;}
  #title-bar{display:flex; align-items:center; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; position:sticky; top:49px; z-index:19; padding:0 16px; height:49px;}
  #conn-dot{width:8px; height:8px; border-radius:50%; background:var(--danger); display:inline-block; flex-shrink:0; margin-right:10px;}
  #conn-dot.ok{background:var(--accent);}
  #main-title{font-size:16px; font-weight:600; flex:1;}
  #cat-list{flex:1; display:flex; overflow-x:auto; overflow-y:hidden;}
  .cat-item{padding:12px 16px; cursor:pointer; display:flex; justify-content:flex-start; align-items:center; gap:8px; flex-shrink:0; white-space:nowrap; border-right:1px solid var(--line);}
  .cat-item:hover{background:var(--panel2);}
  .cat-item.active{background:var(--panel2);}
  .cat-name{font-size:15px;}
  .cat-count{font-size:12px; color:var(--bg); background:var(--accent); border-radius:12px; padding:2px 8px; min-width:20px; text-align:center;}
  .cat-del{font-size:12px; color:var(--sub); cursor:pointer; padding:2px 4px;}
  .cat-del:hover{color:var(--danger);}
  #action-btns{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  #add-cat-btn, #cleanup-btn, #delete-all-btn, #select-mode-btn{flex-shrink:0; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:16px; cursor:pointer;}
  #add-cat-btn{font-size:20px;}
  #select-mode-btn.active{background:var(--accent); border-color:var(--accent);}

  #select-bar{display:flex; align-items:center; gap:8px; padding:8px 16px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; position:sticky; top:98px; z-index:18;}
  #select-count{font-size:13px; color:var(--text); margin-right:auto;}
  #select-bar button{padding:6px 14px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:13px; cursor:pointer;}
  #select-move-btn{background:var(--accent); color:#052014; border-color:var(--accent); font-weight:600;}
  #select-delete-btn{color:var(--danger); border-color:var(--danger);}

  .entry{position:relative;}
  .entry .select-check{display:none; position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%; border:2px solid #fff; background:rgba(0,0,0,0.4); z-index:2; cursor:pointer;}
  .entry.select-mode .select-check{display:block;}
  .entry.selected .select-check{background:var(--accent); border-color:var(--accent);}
  .entry.selected .select-check::after{content:'✓'; color:#052014; font-size:14px; display:flex; align-items:center; justify-content:center; height:100%;}
  .entry.select-mode{cursor:pointer;}

  #range-bar{display:flex; gap:6px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; overflow-x:auto; position:sticky; top:98px; z-index:18;}
  .range-btn{flex-shrink:0; padding:6px 14px; border-radius:16px; border:1px solid var(--line); background:var(--panel2); color:var(--sub); font-size:13px; cursor:pointer;}
  .range-btn.active{background:var(--accent); color:#052014; border-color:var(--accent); font-weight:600;}
  #date-picker{flex-shrink:0; background:var(--panel2); border:1px solid var(--line); border-radius:16px; padding:5px 10px; color:var(--text); font-size:13px; color-scheme:dark;}

  #main{flex:1; display:flex; flex-direction:column; background:#0a1014; min-height:0;}
  #main-title{padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); font-size:16px; font-weight:600;}
  #feed{padding:14px; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; align-content:start;}
  .empty-state{grid-column:1/-1; margin:auto; color:var(--sub); text-align:center; font-size:14px; max-width:320px;}

  .entry{background:var(--bubble-in); border-radius:8px; padding:6px;}
  .entry .who{font-size:11px; font-weight:600; color:#7fd4c4; margin-bottom:3px;}
  .entry .photos{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px;}
  .entry img{width:128px; height:128px; object-fit:cover; border-radius:6px; cursor:zoom-in; flex-shrink:0;}
  .entry .note{font-size:12px; line-height:1.3; white-space:pre-wrap;}
  .entry .meta{font-size:10px; color:var(--sub); margin-top:3px; display:flex; justify-content:space-between; gap:6px; align-items:center;}
  .entry .btns{display:flex; gap:8px; align-items:center; flex-shrink:0;}
  .entry .delbtn{font-size:10px; color:var(--danger); cursor:pointer; flex-shrink:0;}
  .entry .qcbtn{display:flex; align-items:center; justify-content:center; position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,0.45); font-size:13px; cursor:pointer; opacity:0.4; filter:grayscale(1); z-index:2;}
  .entry .qcbtn.checked{opacity:1; filter:none; background:rgba(0,0,0,0.6);}
  .entry.select-mode .qcbtn{display:none;}
  .entry .movebtn{font-size:13px; cursor:pointer; color:var(--sub);}
  .entry .movebtn:hover{color:var(--accent);}
  .entry.qc-done{outline:2px solid var(--accent);}

  #composer{background:var(--panel); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; flex-shrink:0; position:sticky; bottom:0; z-index:20;}
  #name-row{display:flex; gap:8px; align-items:center;}
  #name-row input{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px; width:180px;}
  #name-row span{font-size:12px; color:var(--sub);}
  #photo-preview{display:flex; gap:8px; flex-wrap:wrap;}
  #photo-preview .ph{position:relative; width:64px; height:64px;}
  #photo-preview img{width:64px; height:64px; object-fit:cover; border-radius:6px;}
  #photo-preview .rm{position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff; border-radius:50%; width:18px; height:18px; font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  #input-row{display:flex; gap:8px; align-items:flex-end;}
  #note-input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:10px 16px; color:var(--text); font-size:14px; resize:none; max-height:100px; min-height:20px;}
  .icon-btn{background:var(--panel2); border:1px solid var(--line); border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:18px;}
  #send-btn{background:var(--accent); color:#052014;}
  #file-input, #file-input-camera{display:none;}
  #status{font-size:11px; color:var(--sub); text-align:center; min-height:14px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (max-width:700px){
    #feed{padding:10px; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:8px;}
    #composer{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); gap:6px;}
    #name-row input{width:130px; font-size:12px; padding:6px 8px;}
    #name-row span{font-size:11px;}
    .icon-btn{width:36px; height:36px; font-size:15px;}
    #note-input{font-size:13px; padding:8px 12px;}
    #photo-preview .ph{width:52px; height:52px;}
    #photo-preview img{width:52px; height:52px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="cat-list"></div>
  </div>
  <div id="title-bar">
    <span id="conn-dot" title="Status koneksi"></span>
    <div id="main-title">Pilih kategori</div>
    <div id="action-btns">
      <button id="select-mode-btn" title="Pilih beberapa foto">☑️</button>
      <button id="add-cat-btn" title="Tambah kategori">+</button>
      <button id="cleanup-btn" title="Hapus data lama">🧹</button>
      <button id="delete-all-btn" title="Hapus semua foto di kategori ini">🗑️</button>
    </div>
  </div>
  <div id="main">
    <div id="range-bar">
      <button class="range-btn active" data-range="day">Hari ini</button>
      <button class="range-btn" data-range="week">Minggu ini</button>
      <button class="range-btn" data-range="month">Bulan ini</button>
      <input type="date" id="date-picker" title="Pilih tanggal tertentu"/>
    </div>
    <div id="select-bar" style="display:none;">
      <span id="select-count">0 dipilih</span>
      <button id="select-move-btn">Pindahkan</button>
      <button id="select-delete-btn">Hapus</button>
      <button id="select-cancel-btn">Batal</button>
    </div>
    <div id="feed"><div class="empty-state">Menghubungkan ke database...</div></div>
    <div id="composer">
      <div id="name-row">
        <span>Nama:</span>
        <input id="name-input" placeholder="Nama kamu" maxlength="40"/>
      </div>
      <div id="photo-preview"></div>
      <div id="input-row">
        <div class="icon-btn" id="camera-btn" title="Ambil foto dari kamera">📷</div>
        <div class="icon-btn" id="gallery-btn" title="Pilih dari galeri">🖼️</div>
        <input type="file" id="file-input" accept="image/*" multiple>
        <input type="file" id="file-input-camera" accept="image/*" capture="environment">
        <textarea id="note-input" placeholder="Tulis catatan (qty, kondisi, dll)..." rows="1"></textarea>
        <div class="icon-btn" id="send-btn" title="Kirim">➤</div>
      </div>
      <div id="status"></div>
    </div>
  </div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-box">
    <img id="lightbox-img" src=""/>
  </div>
</div>

<style>
  #lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:999; align-items:center; justify-content:center; padding:20px;}
  #lightbox.open{display:flex;}
  #lightbox-box{background:var(--panel); border-radius:10px; padding:8px; max-width:min(420px,90vw); max-height:80vh; box-shadow:0 4px 20px rgba(0,0,0,0.5);}
  #lightbox img{display:block; max-width:100%; max-height:calc(80vh - 16px); border-radius:6px; margin:0 auto;}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// =====================================================================
// GANTI OBJEK DI BAWAH INI dengan firebaseConfig dari Firebase Console
// (Project settings > General > scroll ke "Your apps" > SDK setup)
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyCCXvCR25dQiTDTNMW8mJBWR5f3gSc14Fg",
  authDomain: "clovy-log-packing-gudang.firebaseapp.com",
  projectId: "clovy-log-packing-gudang",
  storageBucket: "clovy-log-packing-gudang.firebasestorage.app",
  messagingSenderId: "772473495759",
  appId: "1:772473495759:web:c2f7e8152cb32c04a7d7ba"
};
// =====================================================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// GANTI dengan Cloud Name dan Upload Preset dari akun Cloudinary kamu
const CLOUDINARY_CLOUD_NAME = "zocxggxp";
const CLOUDINARY_UPLOAD_PRESET = "o1dtvc2c";

const DEFAULT_CATEGORIES = ["Packing","ATK","Stock","Retur & Refund","SPX"];
let categories = [];
let activeCategory = null;
let activeRange = 'day';
let customDate = null; // 'YYYY-MM-DD' string or null
let pendingPhotos = [];
let entriesCache = {}; // category -> array of entries (sorted)
let selectMode = false;
let selectedIds = new Set();

function isInRange(ts, range){
  if(customDate){
    const d = new Date(ts);
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}` === customDate;
  }
  if(range==='all') return true;
  const now = new Date();
  const d = new Date(ts);
  if(range==='day'){
    return d.toDateString() === now.toDateString();
  }
  if(range==='week'){
    const start = new Date(now);
    const day = (now.getDay()+6)%7; // Monday=0
    start.setDate(now.getDate()-day);
    start.setHours(0,0,0,0);
    return d >= start;
  }
  if(range==='month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  return true;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function status(msg){ document.getElementById('status').textContent = msg; }

window.openLightbox = function(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox = function(){
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
};

function setConnected(ok){
  document.getElementById('conn-dot').className = ok ? 'ok' : '';
}

// ---------- Categories ----------
async function ensureCategoriesDoc(){
  const ref = doc(db, 'meta', 'categories');
  onSnapshot(ref, (snap)=>{
    setConnected(true);
    if(snap.exists() && snap.data().list && snap.data().list.length){
      categories = snap.data().list;
    } else {
      categories = DEFAULT_CATEGORIES.slice();
      setDoc(ref, { list: categories }).catch(()=>{});
    }
    renderSidebar();
    if(!activeCategory && categories.length) selectCategory(categories[0]);
  }, (err)=>{
    console.error(err);
    setConnected(false);
    status('Gagal terhubung ke database. Cek konfigurasi Firebase.');
  });
}

async function addCategory(name){
  if(categories.includes(name)) return;
  categories.push(name);
  await setDoc(doc(db,'meta','categories'), { list: categories });
}

// ---------- Entries ----------
function listenCategory(cat){
  const q = query(collection(db, 'entries', cat, 'items'), orderBy('timestamp','asc'));
  onSnapshot(q, (snap)=>{
    const arr = [];
    snap.forEach(d=> arr.push(d.data()));
    entriesCache[cat] = arr;
    if(activeCategory === cat) renderFeed();
    renderSidebar();
  }, (err)=>{
    console.error(err);
  });
}

const listenedCategories = new Set();
function ensureListening(cat){
  if(listenedCategories.has(cat)) return;
  listenedCategories.add(cat);
  listenCategory(cat);
}

// ---------- Rendering ----------
function renderSidebar(){
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  for(const cat of categories){
    ensureListening(cat);
    const count = (entriesCache[cat]||[]).length;
    const div = document.createElement('div');
    div.className = 'cat-item' + (cat===activeCategory ? ' active':'');
    div.dataset.cat = cat;
    div.innerHTML = `<span class="cat-name">${escapeHtml(cat)}</span><span class="cat-count">${count}</span><span class="cat-del" data-cat="${escapeHtml(cat)}" title="Hapus kategori ini">✕</span>`;
    list.appendChild(div);
  }
}

document.getElementById('cat-list').addEventListener('click', (e)=>{
  const delBtn = e.target.closest('.cat-del');
  if(delBtn){
    deleteCategory(delBtn.dataset.cat);
    return;
  }
  const item = e.target.closest('.cat-item');
  if(!item) return;
  selectCategory(item.dataset.cat);
});

async function deleteCategory(cat){
  if(!confirm(`Hapus kategori "${cat}"? Semua entri (foto & catatan) di kategori ini akan ikut terhapus permanen.`)) return;
  if(!confirm(`Yakin? Tindakan ini tidak bisa dibatalkan.`)) return;
  status(`Menghapus kategori "${cat}"...`);
  const items = entriesCache[cat] || [];
  for(const it of items){
    try{ await deleteDoc(doc(db, 'entries', cat, 'items', it.id)); }catch(err){ console.error(err); }
  }
  categories = categories.filter(c => c !== cat);
  await setDoc(doc(db,'meta','categories'), { list: categories });
  delete entriesCache[cat];
  listenedCategories.delete(cat);
  if(activeCategory === cat){
    activeCategory = null;
    if(categories.length) selectCategory(categories[0]);
    else { renderSidebar(); renderFeed(); }
  } else {
    renderSidebar();
  }
  status('');
}

function selectCategory(cat){
  activeCategory = cat;
  document.getElementById('main-title').textContent = cat;
  ensureListening(cat);
  renderSidebar();
  renderFeed();
}

function renderFeed(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  if(!activeCategory){
    feed.innerHTML = '<div class="empty-state">Pilih kategori di kiri untuk mulai</div>';
    return;
  }
  const allEntries = entriesCache[activeCategory] || [];
  const entries = allEntries.filter(e => isInRange(e.timestamp, activeRange));
  if(entries.length===0){
    feed.innerHTML = `<div class="empty-state">${allEntries.length===0 ? 'Belum ada entri. Tambahkan foto/catatan pertama di bawah.' : 'Tidak ada entri pada rentang waktu ini.'}</div>`;
    return;
  }
  for(const e of entries){
    const div = document.createElement('div');
    div.className = 'entry' + (e.checked ? ' qc-done' : '') + (selectMode ? ' select-mode' : '') + (selectedIds.has(e.id) ? ' selected' : '');
    div.dataset.id = e.id;
    let photosHtml = '';
    if(e.photos && e.photos.length){
      photosHtml = `<div class="photos">${e.photos.map(p=>`<img src="${p}" onclick="openLightbox('${p}')"/>`).join('')}</div>`;
    }
    div.innerHTML = `
      <div class="select-check"></div>
      <div class="qcbtn ${e.checked?'checked':''}" data-id="${e.id}" title="Tandai sudah dicek QC">✅</div>
      <div class="who">${escapeHtml(e.name||'Tanpa nama')}</div>
      ${photosHtml}
      ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
      <div class="meta"><span>${new Date(e.timestamp).toLocaleString('id-ID',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><span class="btns"><span class="movebtn" data-id="${e.id}" title="Pindahkan ke kategori lain">↪</span><span class="delbtn" data-id="${e.id}">Hapus</span></span></div>
    `;
    feed.appendChild(div);
  }
  feed.querySelectorAll('.delbtn').forEach(btn=>{
    btn.onclick = ()=> deleteEntry(btn.dataset.id);
  });
  feed.querySelectorAll('.qcbtn').forEach(btn=>{
    btn.onclick = ()=> toggleQC(btn.dataset.id, !btn.classList.contains('checked'));
  });
  feed.querySelectorAll('.movebtn').forEach(btn=>{
    btn.onclick = ()=> moveEntry(btn.dataset.id);
  });
  feed.scrollTop = feed.scrollHeight;
}

async function moveEntry(id){
  const entry = (entriesCache[activeCategory]||[]).find(e=>e.id===id);
  if(!entry) return;
  const others = categories.filter(c=>c!==activeCategory);
  if(others.length===0){ alert('Tidak ada kategori lain untuk memindahkan.'); return; }
  const listStr = others.map((c,i)=>`${i+1}. ${c}`).join('\n');
  const input = window.prompt(`Pindahkan entri ini ke kategori mana?\n${listStr}\n\nKetik angka atau nama kategorinya:`);
  if(!input) return;
  const trimmed = input.trim();
  let target = others.find(c => c.toLowerCase() === trimmed.toLowerCase());
  if(!target){
    const idx = parseInt(trimmed) - 1;
    if(!isNaN(idx) && others[idx]) target = others[idx];
  }
  if(!target){ alert('Kategori tidak ditemukan. Coba lagi dengan mengetik nama atau angka yang benar.'); return; }
  status(`Memindahkan ke "${target}"...`);
  try{
    await setDoc(doc(db, 'entries', target, 'items', entry.id), entry);
    await deleteDoc(doc(db, 'entries', activeCategory, 'items', entry.id));
    status('');
  }catch(err){
    console.error(err);
    status('Gagal memindahkan entri.');
  }
}

async function toggleQC(id, checked){
  try{
    await updateDoc(doc(db, 'entries', activeCategory, 'items', id), { checked });
  }catch(e){ console.error(e); status('Gagal update status QC.'); }
}

async function deleteEntry(id){
  if(!confirm('Hapus entri ini?')) return;
  try{
    await deleteDoc(doc(db, 'entries', activeCategory, 'items', id));
  }catch(e){ console.error(e); status('Gagal menghapus.'); }
}

async function uploadToCloudinary(dataUrl){
  const formData = new FormData();
  formData.append('file', dataUrl);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  });
  const json = await res.json();
  if(!json.secure_url) throw new Error('Upload ke Cloudinary gagal');
  return json.secure_url;
}

async function uploadPhotos(dataUrls){
  const urls = [];
  for(const d of dataUrls){
    const url = await uploadToCloudinary(d);
    urls.push(url);
  }
  return urls;
}

// ---------- Photo handling ----------
function resizeImage(file, maxDim=1900, quality=0.85){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h && w>maxDim){ h = h*maxDim/w; w = maxDim; }
        else if(h>maxDim){ w = w*maxDim/h; h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPhotoPreview(){
  const box = document.getElementById('photo-preview');
  box.innerHTML = '';
  pendingPhotos.forEach((p, idx)=>{
    const div = document.createElement('div');
    div.className = 'ph';
    div.innerHTML = `<img src="${p}"/><div class="rm" data-idx="${idx}">×</div>`;
    box.appendChild(div);
  });
  box.querySelectorAll('.rm').forEach(rm=>{
    rm.onclick = ()=>{
      pendingPhotos.splice(parseInt(rm.dataset.idx),1);
      renderPhotoPreview();
    };
  });
}

// ---------- Events ----------
document.getElementById('camera-btn').onclick = ()=> document.getElementById('file-input-camera').click();
document.getElementById('gallery-btn').onclick = ()=> document.getElementById('file-input').click();

async function handlePickedFiles(fileList){
  const files = Array.from(fileList).slice(0, 3 - pendingPhotos.length);
  if(files.length===0){ status('Maksimal 3 foto per kiriman.'); return; }
  status('Memproses foto...');
  for(const f of files){
    try{
      const dataUrl = await resizeImage(f);
      pendingPhotos.push(dataUrl);
    }catch(err){ console.error(err); }
  }
  renderPhotoPreview();
  status('');
}

document.getElementById('file-input').onchange = async (e)=>{
  await handlePickedFiles(e.target.files);
  e.target.value = '';
};

document.getElementById('file-input-camera').onchange = async (e)=>{
  await handlePickedFiles(e.target.files);
  e.target.value = '';
};

document.getElementById('add-cat-btn').onclick = async ()=>{
  const name = (window.prompt('Nama kategori baru:') || '').trim();
  if(!name) return;
  await addCategory(name);
  selectCategory(name);
};

document.getElementById('delete-all-btn').onclick = async ()=>{
  if(!activeCategory){ status('Pilih kategori dulu.'); return; }
  const all = entriesCache[activeCategory] || [];
  if(all.length===0){ alert(`Tidak ada entri di kategori "${activeCategory}".`); return; }
  if(!confirm(`Hapus SEMUA ${all.length} entri di kategori "${activeCategory}"? Tindakan ini tidak bisa dibatalkan.`)) return;
  if(!confirm(`Yakin? Ini akan menghapus seluruh foto dan catatan di kategori "${activeCategory}" secara permanen.`)) return;
  status(`Menghapus ${all.length} entri...`);
  for(const e of all){
    try{ await deleteDoc(doc(db, 'entries', activeCategory, 'items', e.id)); }catch(err){ console.error(err); }
  }
  status('');
  alert(`Semua entri di kategori "${activeCategory}" sudah dihapus.`);
};

document.getElementById('cleanup-btn').onclick = async ()=>{
  if(!activeCategory){ status('Pilih kategori dulu.'); return; }
  const CUTOFF_DAYS = 45;
  const cutoff = Date.now() - CUTOFF_DAYS*24*60*60*1000;
  const all = entriesCache[activeCategory] || [];
  const old = all.filter(e => e.timestamp < cutoff);
  if(old.length===0){ alert(`Tidak ada entri di kategori "${activeCategory}" yang lebih lama dari ${CUTOFF_DAYS} hari.`); return; }
  if(!confirm(`Hapus ${old.length} entri di kategori "${activeCategory}" yang lebih lama dari ${CUTOFF_DAYS} hari? Tindakan ini tidak bisa dibatalkan.`)) return;
  status(`Menghapus ${old.length} entri lama...`);
  for(const e of old){
    try{ await deleteDoc(doc(db, 'entries', activeCategory, 'items', e.id)); }catch(err){ console.error(err); }
  }
  status('');
  alert('Selesai membersihkan data lama.');
};

document.getElementById('note-input').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight,100)+'px';
});
document.getElementById('note-input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('send-btn').click();
  }
});

document.getElementById('send-btn').onclick = async ()=>{
  if(!activeCategory){ status('Pilih kategori dulu.'); return; }
  const name = document.getElementById('name-input').value.trim();
  const note = document.getElementById('note-input').value.trim();
  if(!name){ status('Isi nama kamu dulu.'); return; }
  if(!note && pendingPhotos.length===0){ status('Tulis catatan atau lampirkan foto.'); return; }

  localStorage.setItem('log-gudang-username', name);

  const id = uid();
  let photoUrls = [];
  if(pendingPhotos.length){
    status('Mengupload foto...');
    try{
      photoUrls = await uploadPhotos(pendingPhotos);
    }catch(err){
      console.error(err);
      status('Gagal upload foto. Cek koneksi internet atau pengaturan Cloudinary, lalu coba lagi.');
      return;
    }
  }
  const entry = { id, name, note, photos: photoUrls, timestamp: Date.now() };
  status('Mengirim...');
  try{
    await setDoc(doc(db, 'entries', activeCategory, 'items', id), entry);
    document.getElementById('note-input').value = '';
    document.getElementById('note-input').style.height = 'auto';
    pendingPhotos = [];
    renderPhotoPreview();
    status('');
  }catch(err){
    console.error(err);
    status('Gagal menyimpan entri. Coba lagi.');
  }
};

document.querySelectorAll('.range-btn').forEach(btn=>{
  btn.onclick = ()=>{
    activeRange = btn.dataset.range;
    customDate = null;
    document.getElementById('date-picker').value = '';
    document.querySelectorAll('.range-btn').forEach(b=> b.classList.toggle('active', b===btn));
    renderFeed();
  };
});

document.getElementById('date-picker').addEventListener('change', (e)=>{
  if(!e.target.value){ customDate = null; renderFeed(); return; }
  customDate = e.target.value;
  document.querySelectorAll('.range-btn').forEach(b=> b.classList.remove('active'));
  renderFeed();
});

// ---------- Multi-select mode ----------
document.getElementById('feed').addEventListener('click', (e)=>{
  if(!selectMode) return;
  const entryEl = e.target.closest('.entry');
  if(!entryEl) return;
  e.stopPropagation();
  e.preventDefault();
  toggleSelect(entryEl.dataset.id);
}, true);

function toggleSelect(id){
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  updateSelectUI();
}

function updateSelectUI(){
  document.querySelectorAll('.entry').forEach(el=>{
    el.classList.toggle('selected', selectedIds.has(el.dataset.id));
  });
  document.getElementById('select-count').textContent = `${selectedIds.size} dipilih`;
}

function setSelectMode(on){
  selectMode = on;
  if(!on) selectedIds.clear();
  document.getElementById('select-mode-btn').classList.toggle('active', on);
  document.getElementById('range-bar').style.display = on ? 'none' : 'flex';
  document.getElementById('select-bar').style.display = on ? 'flex' : 'none';
  renderFeed();
  updateSelectUI();
}

document.getElementById('select-mode-btn').onclick = ()=> setSelectMode(!selectMode);
document.getElementById('select-cancel-btn').onclick = ()=> setSelectMode(false);

document.getElementById('select-delete-btn').onclick = async ()=>{
  if(selectedIds.size===0){ alert('Belum ada foto yang dipilih.'); return; }
  if(!confirm(`Hapus ${selectedIds.size} entri terpilih? Tindakan ini tidak bisa dibatalkan.`)) return;
  status(`Menghapus ${selectedIds.size} entri...`);
  for(const id of selectedIds){
    try{ await deleteDoc(doc(db, 'entries', activeCategory, 'items', id)); }catch(err){ console.error(err); }
  }
  setSelectMode(false);
  status('');
};

document.getElementById('select-move-btn').onclick = async ()=>{
  if(selectedIds.size===0){ alert('Belum ada foto yang dipilih.'); return; }
  const others = categories.filter(c=>c!==activeCategory);
  if(others.length===0){ alert('Tidak ada kategori lain untuk memindahkan.'); return; }
  const listStr = others.map((c,i)=>`${i+1}. ${c}`).join('\n');
  const input = window.prompt(`Pindahkan ${selectedIds.size} entri ke kategori mana?\n${listStr}\n\nKetik angka atau nama kategorinya:`);
  if(!input) return;
  const trimmed = input.trim();
  let target = others.find(c => c.toLowerCase() === trimmed.toLowerCase());
  if(!target){
    const idx = parseInt(trimmed) - 1;
    if(!isNaN(idx) && others[idx]) target = others[idx];
  }
  if(!target){ alert('Kategori tidak ditemukan.'); return; }
  status(`Memindahkan ${selectedIds.size} entri ke "${target}"...`);
  const all = entriesCache[activeCategory] || [];
  for(const id of selectedIds){
    const entry = all.find(e=>e.id===id);
    if(!entry) continue;
    try{
      await setDoc(doc(db, 'entries', target, 'items', entry.id), entry);
      await deleteDoc(doc(db, 'entries', activeCategory, 'items', entry.id));
    }catch(err){ console.error(err); }
  }
  setSelectMode(false);
  status('');
};

// ---------- Init ----------
const savedName = localStorage.getItem('log-gudang-username');
if(savedName) document.getElementById('name-input').value = savedName;
ensureCategoriesDoc();
</script>
